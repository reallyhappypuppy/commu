<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Pebble 작성 — {{ SITE_NAME if SITE_NAME else "REZEnesis" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="/">{{ SITE_NAME if SITE_NAME else "REZEnesis" }}</a>
    <div class="nav-actions">
      <a class="btn" href="/">목록</a>
    </div>
  </nav>

  <div class="container">
    <div class="form-card">
      <form method="POST">
        <input class="input" name="title" placeholder="Pebble 제목" required>
        <textarea class="input" name="content" rows="6" placeholder="내용을 입력하세요..." required style="margin-top:10px;"></textarea>
        <div style="text-align:right; margin-top:10px;">
          <button class="primary" type="submit">게시</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
