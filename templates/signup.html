<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | REZEnesis</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 손글씨 느낌 폰트 (Caveat) -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: radial-gradient(circle at 50% 20%, #00141c, #000);
      color: #eaf9f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .signup-container {
      background: rgba(15, 25, 30, 0.85);
      border: 1px solid rgba(100, 180, 190, 0.2);
      border-radius: 16px;
      box-shadow: 0 0 24px rgba(20, 100, 110, 0.3);
      padding: 32px 40px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    h1 {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      color: #6ed7e6;
      margin-bottom: 0.8em;
      letter-spacing: 1px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(100, 180, 190, 0.3);
      border-radius: 8px;
      padding: 12px;
      color: #eaf9f8;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #6ed7e6;
      box-shadow: 0 0 8px #6ed7e6;
    }
    button {
      background: linear-gradient(120deg, #3ca3b8, #6ed7e6);
      border: none;
      border-radius: 8px;
      color: #00141c;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 10px #6ed7e6;
    }
    .bottom-link {
      margin-top: 1.2em;
      color: #9fd3dc;
      font-size: 0.9rem;
    }
    .bottom-link a {
      color: #6ed7e6;
      text-decoration: none;
      font-weight: 600;
    }
    .bottom-link a:hover {
      text-decoration: underline;
    }
    @media (max-width: 500px) {
      h1 {
        font-size: 2.2rem;
      }
      .signup-container {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h1>REZEnesis</h1>
    <form method="POST">
      <input type="text" name="username" placeholder="사용자 이름" required>
      <input type="password" name="password" placeholder="비밀번호" required>
      <input type="password" name="password2" placeholder="비밀번호 확인" required>
      <button type="submit">회원가입</button>
    </form>
    <div class="bottom-link">
      이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a>
    </div>
  </div>
</body>
</html>
